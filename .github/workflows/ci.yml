name: CI

# Type-check, unit tests, and a production build on every PR and on pushes to
# main. This is the gate that keeps main green and gives PRs a required check.
on:
  pull_request:
  push:
    branches: [main]

# Nothing here writes to the repo — read-only token is all we need.
permissions:
  contents: read

# A newer commit on the same ref supersedes in-flight runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Type-check · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
